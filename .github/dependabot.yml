version: 2
updates:
  - package-ecosystem: npm
    directory: /blume
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      blume-runtime:
        patterns:
          - blume
          - astro
          - "@astrojs/*"
          - "@scalar/*"
          - sharp
          - esbuild
          - undici

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
